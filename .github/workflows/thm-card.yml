name: TryHackMe card

on:
  # once a day
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/thm_card.py", ".github/workflows/thm-card.yml"]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Draw the card from the public TryHackMe profile
        run: mkdir -p dist && python3 .github/scripts/thm_card.py S0uls dist/thm-card.svg
      - name: Push it to the thm-card branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: thm-card
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
